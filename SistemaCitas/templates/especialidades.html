{% extends "base.html" %}
{% block title %}Especialidades{% endblock %}
{% block content %}
<div class="card shadow-sm"><div class="card-body">
  <h1 class="h4 mb-3">Especialidades</h1>
  <form method="post" class="row g-2 mb-4">
    <div class="col-sm-8 col-md-6"><input name="nombre" class="form-control" placeholder="Nueva especialidad" required minlength="3"></div>
    <div class="col-auto"><button class="btn btn-success" type="submit"><i class="bi bi-plus-lg"></i> Agregar</button></div>
  </form>
  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead><tr><th>Nombre</th><th>Médicos</th><th class="text-end">Acciones</th></tr></thead>
      <tbody>
      {% for e in especialidades %}
        <tr>
          <td>
            <form id="ed{{ e.id }}" method="post" action="{{ url_for('especialidad_editar', esp_id=e.id) }}" class="d-flex gap-2">
              <input name="nombre" value="{{ e.nombre }}" class="form-control form-control-sm" required minlength="3">
              <button class="btn btn-sm btn-warning" type="submit"><i class="bi bi-save"></i> Guardar</button>
            </form>
          </td>
          <td>{{ e.medicos }}</td>
          <td class="text-end">
            <form class="d-inline" method="post" action="{{ url_for('especialidad_eliminar', esp_id=e.id) }}"
                  onsubmit="return confirm('¿Eliminar la especialidad? Los médicos quedarán sin especialidad.');">
              <button class="btn btn-sm btn-danger" type="submit"><i class="bi bi-trash"></i> Eliminar</button>
            </form>
          </td>
        </tr>
      {% else %}
        <tr><td colspan="3" class="text-center text-muted">No hay especialidades.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div></div>
{% endblock %}
